<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Protected Page</title>
    <script type="module">function find(selector) {
    const element = document.querySelector(selector);
    if (element)
        return element;
    throw new Error('No element found with selector: ' + selector);
}
const pwd = find('#pwd');
const msg = find('#msg');
const form = find('form');
const togglePassword = find('#toggle-password');
const unlock = find('#unlock');
const languageSelect = find('#language');
const messages = {
    en: {
        title: 'Protected Page',
        protected: 'This page is password protected.',
        password: 'Password',
        showPassword: 'Show',
        hidePassword: 'Hide',
        showPasswordLabel: 'Show password',
        hidePasswordLabel: 'Hide password',
        unlock: 'Unlock',
        unlocking: 'Unlocking…',
        wrongPassword: 'Incorrect password. Try again.',
        missingPayload: 'The encrypted content is missing or invalid.',
        missingCrypto: 'This browser does not support decryption.',
        language: 'Language',
    },
    'zh-CN': {
        title: '受密码保护的页面',
        protected: '此页面受密码保护。',
        password: '输入密码',
        showPassword: '显示',
        hidePassword: '隐藏',
        showPasswordLabel: '显示密码',
        hidePasswordLabel: '隐藏密码',
        unlock: '解锁',
        unlocking: '正在解锁…',
        wrongPassword: '密码不正确，请重试。',
        missingPayload: '加密内容缺失或无效。',
        missingCrypto: '此浏览器不支持解密。',
        language: '语言',
    },
};
let language = document.documentElement.lang === 'zh-CN' ? 'zh-CN' : 'en';
let message = 'protected';
let busy = false;
let ready = false;
function render() {
    const text = messages[language];
    document.documentElement.lang = language;
    document.title = text.title;
    languageSelect.value = language;
    languageSelect.setAttribute('aria-label', text.language);
    msg.textContent = text[message];
    msg.classList.toggle('error', message !== 'protected');
    pwd.placeholder = text.password;
    pwd.setAttribute('aria-label', text.password);
    pwd.setAttribute('aria-invalid', String(message === 'wrongPassword'));
    pwd.disabled = busy || !ready;
    const passwordVisible = pwd.type === 'text';
    togglePassword.textContent = passwordVisible ? text.hidePassword : text.showPassword;
    togglePassword.setAttribute('aria-label', passwordVisible ? text.hidePasswordLabel : text.showPasswordLabel);
    togglePassword.setAttribute('aria-pressed', String(passwordVisible));
    togglePassword.disabled = busy || !ready;
    unlock.value = busy ? text.unlocking : text.unlock;
    unlock.disabled = busy || !ready;
    form.setAttribute('aria-busy', String(busy));
}
languageSelect.addEventListener('change', () => {
    language = languageSelect.value === 'zh-CN' ? 'zh-CN' : 'en';
    render();
});
togglePassword.addEventListener('click', () => {
    pwd.type = pwd.type === 'password' ? 'text' : 'password';
    render();
    pwd.focus();
});
pwd.addEventListener('input', () => {
    if (message === 'wrongPassword') {
        message = 'protected';
        render();
    }
});
render();
let salt, iv, ciphertext, iterations;
const subtle = window.crypto?.subtle ||
    window.crypto?.webkitSubtle;
document.addEventListener('DOMContentLoaded', async () => {
    if (!subtle) {
        message = 'missingCrypto';
        render();
        return;
    }
    ready = true;
    render();
    pwd.focus();
});
form.addEventListener('submit', async (event) => {
    event.preventDefault();
    await decrypt();
});
async function decrypt() {
    if (!ready || busy)
        return;
    busy = true;
    message = 'protected';
    render();
    await new Promise((resolve) => setTimeout(resolve, 60));
    try {
        if (!ciphertext) {
            const parts = [];
            for (const path of ["payload/00.bin", "payload/01.bin", "payload/02.bin", "payload/03.bin", "payload/04.bin", "payload/05.bin", "payload/06.bin", "payload/07.bin", "payload/08.bin", "payload/09.bin"]) {
                const response = await fetch(new URL(path, location.href));
                if (!response.ok)
                    throw new Error('Payload download failed');
                parts.push(new Uint8Array(await response.arrayBuffer()));
            }
            const bytes = new Uint8Array(parts.reduce((total, part) => total + part.length, 0));
            let offset = 0;
            for (const part of parts) {
                bytes.set(part, offset);
                offset += part.length;
            }
            salt = bytes.subarray(0, 32);
            iv = bytes.subarray(32, 48);
            ciphertext = bytes.subarray(48);
            iterations = 2000000;
        }
        const decrypted = await decryptFile({ salt, iv, ciphertext, iterations }, pwd.value);
        document.write(decrypted);
        document.close();
    }
    catch {
        message = 'wrongPassword';
        busy = false;
        pwd.value = '';
        render();
        pwd.focus();
    }
}
async function deriveKey(salt, password, iterations) {
    const encoder = new TextEncoder();
    const baseKey = await subtle.importKey('raw', encoder.encode(password), 'PBKDF2', false, [
        'deriveKey',
    ]);
    return await subtle.deriveKey({ name: 'PBKDF2', salt, iterations, hash: 'SHA-256' }, baseKey, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function importKey(key) {
    return subtle.importKey('jwk', key, 'AES-GCM', true, ['decrypt']);
}
async function decryptFile({ salt, iv, ciphertext, iterations, }, password) {
    const decoder = new TextDecoder();
    const key = await deriveKey(salt, password, iterations);
    const data = new Uint8Array(await subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext));
    if (!data)
        throw 'Malformed data';
    // If no exception were thrown, decryption succeded and we can save the key.
    return decoder.decode(data);
}
</script>
    <style>*,:before,:after{box-sizing:border-box;border:0}html{-webkit-text-size-adjust:100%;-moz-tab-size:4;tab-size:4;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Noto Sans,Ubuntu,Cantarell,Helvetica Neue,Arial,sans-serif;line-height:1.5}body{line-height:inherit;margin:0}a{color:inherit;-webkit-text-decoration:inherit;text-decoration:inherit}button,input{font-family:inherit;font-size:100%;line-height:inherit;color:inherit;margin:0;padding:0}button{text-transform:none;-webkit-appearance:button}:-moz-focusring{outline:auto}:-moz-ui-invalid{box-shadow:none}p{margin:0}input::-moz-placeholder{opacity:1}input:-ms-placeholder-shown{opacity:1}input::-ms-input-placeholder{opacity:1}input::placeholder{opacity:1}:disabled{cursor:default}svg{vertical-align:middle;display:block}[hidden]{display:none}:root{--lightningcss-light:initial;--lightningcss-dark: ;color-scheme:light;color:#202124;font-synthesis:none;-webkit-font-smoothing:antialiased;background:#f6f7f8;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif}body{min-width:280px;margin:0}main{min-height:100vh;align-items:center;justify-items:center;min-height:100svh;padding:88px 24px;display:grid}.box{background:#fff;border:1px solid #e7e9ec;border-radius:20px;width:100%;max-width:400px;padding:36px 32px 32px;box-shadow:0 4px 24px rgba(32,33,36,.016)}header{margin-bottom:28px}#msg{letter-spacing:-.025em;font-size:19px;font-weight:500;line-height:1.5}#msg.error{color:#bc3636}form{gap:12px;display:grid}.password-row{grid-template-columns:minmax(0,1fr) auto;gap:10px;display:grid}#pwd,#unlock,#toggle-password{border-radius:10px;width:100%;min-height:48px;font-family:inherit;font-size:15px;line-height:1.5;transition:border-color .15s,background-color .15s,box-shadow .15s}#pwd{color:#202124;background:#fff;border:1px solid #dfe2e6;padding:12px 14px;font-size:16px}#pwd::-ms-input-placeholder{color:#92979f;opacity:1}#pwd::placeholder{color:#92979f;opacity:1}#pwd:hover:not(:disabled){border-color:#b9bec6}#pwd:focus{border-color:#9098a3;outline:none;box-shadow:0 0 0 3px rgba(32,33,36,.035)}#pwd[aria-invalid=true]{border-color:#d89090}#unlock{color:#fff;cursor:pointer;background:#25272b;border:1px solid #25272b;padding:12px 16px;font-weight:500}#unlock:hover:not(:disabled){background:#3a3d43;border-color:#3a3d43}#unlock:active:not(:disabled){background:#151619}#unlock:disabled{opacity:.6;cursor:wait}#toggle-password{color:#39423d;cursor:pointer;background:#fff;border:1px solid #dfe2e6;min-width:76px;padding:12px 14px;font-size:13px;font-weight:500}#toggle-password:hover:not(:disabled){background:#f9faf9;border-color:#b9bec6}#toggle-password:disabled{opacity:.6;cursor:wait}#language{color:#61666e;cursor:pointer;background:#fff;border:1px solid #e2e5e9;border-radius:9px;max-width:calc(100% - 48px);min-height:36px;padding:6px 10px;font-family:inherit;font-size:13px;line-height:1.5;position:absolute;top:24px;right:24px}#unlock:focus-visible{outline-offset:3px;outline:2px solid #7c8796}#toggle-password:focus-visible{outline-offset:3px;outline:2px solid #7c8796}#language:focus-visible{outline-offset:3px;outline:2px solid #7c8796}.hidden{display:none!important}@media (max-width:480px){main{padding:80px 20px}.box{border-radius:16px;padding:30px 24px 24px}#msg{font-size:18px}#language{top:20px;right:20px}}@media (prefers-reduced-motion:reduce){#pwd,#unlock,#toggle-password{transition:none}}</style>
</head>
<body>
    <select id="language" aria-label="Language">
        <option value="en" lang="en">English</option>
        <option value="zh-CN" lang="zh-CN">简体中文</option>
    </select>
    <main>
        <div class="box">
            <header>
                <p id="msg" role="status" aria-live="polite">This page is password protected.</p>
            </header>
            <form>
                <div class="password-row">
                    <input type="password" id="pwd" name="pwd" aria-label="Password" placeholder="Password" autocomplete="current-password" spellcheck="false" disabled>
                    <button id="toggle-password" type="button" aria-label="Show password" aria-pressed="false" disabled>Show</button>
                </div>
                <input id="unlock" type="submit" value="Unlock" disabled>
            </form>
        </div>
    </main>
    
</body>
</html>
